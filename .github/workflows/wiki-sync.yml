name: Wiki sync
# Publishes the repo's wiki/ folder to the GitHub wiki (a separate <repo>.wiki.git repository).
# The wiki pages are edited and reviewed here like code; this copies them over after they reach master.
# The wiki must be enabled with at least one page created in the browser before the first run.
on:
  push:
    branches:
      - master
    paths:
      - 'wiki/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wiki-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Copy wiki/ to the GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.wiki.git" wiki-repo
          # The wiki mirrors wiki/ exactly: pages removed here are removed there
          rsync -a --delete --exclude '.git' wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
            exit 0
          fi
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
